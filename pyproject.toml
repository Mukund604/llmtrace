[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtrace"
version = "0.1.0"
description = "Local first observability for LLM apps: traces, cost, failure breakdown and drift alerts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
llmtrace = "llmtrace.cli:main"

[tool.setuptools]
packages = ["llmtrace"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
